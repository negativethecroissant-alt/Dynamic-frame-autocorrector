name: Build Geode Mod

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Android64
            os: ubuntu-latest
            target: Android64
          - name: Android32
            os: ubuntu-latest
            target: Android32
          - name: iOS
            os: macos-latest
            target: iOS
          - name: Windows
            os: windows-latest
            target: Win64

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Build Geode Mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: latest
          cli: latest
          target: ${{ matrix.target }}
          combine: true

      - name: Upload Built Mod Package
        uses: actions/upload-artifact@v4
        with:
          name: TickAutoCorrect-${{ matrix.name }}
          path: ${{ steps.build.outputs.build-output }}
